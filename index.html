<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Control - LocalStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <!-- Pantalla de Carga (Loading Spinner) -->
    <div id="loading-screen"
        class="position-fixed top-0 start-0 w-100 h-100 bg-white d-flex flex-column justify-content-center align-items-center"
        style="z-index: 9999; transition: opacity 0.4s ease;">
        <div class="spinner-border text-dark mb-3" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h5 class="fw-bold text-dark tracking-wide">CARGANDO TASKS CONTROL...</h5>
    </div>

    <!-- Header / Navbar con Logo y mejor presencia -->
    <header class="navbar-enhanced bg-white py-3 shadow-sm mb-4">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3 mx-auto">
                <!-- Logo T&C -->
                <img src="/img/logo.svg" alt="Tasks Control Logo" width="38" height="38" class="rounded shadow-sm">
                <div class="text-center text-sm-start">
                    <h1 class="h5 m-0 fw-bold tracking-tight text-dark">TASKS CONTROL</h1>
                    <small class="text-muted d-block" style="font-size: 0.75rem;">organiza tus tareas, cumple tus
                        metas...</small>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 my-2 flex-grow-1">
        <div class="row g-4">
            <!-- Formulario Nueva Tarea -->
            <div class="col-lg-3 col-md-4">
                <div class="bg-white text-dark p-4 rounded shadow-sm border">
                    <h2 class="h5 mb-3 fw-bold">NUEVA TAREA</h2>
                    <form id="formularioTarea">
                        <div class="mb-3">
                            <label for="titulo-tarea" class="form-label fw-semibold small">Título de la tarea</label>
                            <input type="text" id="titulo-tarea" class="form-control"
                                placeholder="Ej: Estudiar JavaScript">
                        </div>
                        <div class="mb-3">
                            <label for="descripcion-tarea" class="form-label fw-semibold small">Descripción</label>
                            <textarea id="descripcion-tarea" class="form-control" rows="3"
                                placeholder="Escribe los detalles..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="fecha-entrega" class="form-label fw-semibold small">Fecha de entrega</label>
                            <input type="date" id="fecha-entrega" class="form-control">
                        </div>
                        <div class="mb-4">
                            <label for="prioridad" class="form-label fw-semibold small">Prioridad</label>
                            <select id="prioridad" class="form-select">
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Agregar tarea</button>
                    </form>
                </div>
            </div>

            <!-- Tablero de Columnas (Kanban) -->
            <div class="col-lg-9 col-md-8">
                <!-- Barra de Búsqueda -->
                <div class="bg-white p-3 rounded shadow-sm border mb-4">
                    <div class="row g-2">
                        <div class="col-sm-9">
                            <input type="text" id="searchInput" class="form-control"
                                placeholder="Buscar tareas por título o descripción...">
                        </div>
                        <div class="col-sm-3">
                            <button id="searchBtn" class="btn btn-dark w-100">Filtrar</button>
                        </div>
                    </div>
                </div>

                <!-- Las 3 Columnas -->
                <div class="row g-3">
                    <!-- Columna Por Hacer -->
                    <div class="col-md-4">
                        <div class="kanban-column p-3 rounded shadow-sm h-100">
                            <h3 class="h6 fw-bold text-uppercase mb-3 text-secondary border-bottom pb-2">Por Hacer</h3>
                            <div class="tasks-container d-flex flex-column gap-3" id="taskList-porHacer"></div>
                        </div>
                    </div>

                    <!-- Columna En Progreso -->
                    <div class="col-md-4">
                        <div class="kanban-column p-3 rounded shadow-sm h-100">
                            <h3 class="h6 fw-bold text-uppercase mb-3 text-secondary border-bottom pb-2">En Progreso
                            </h3>
                            <div class="tasks-container d-flex flex-column gap-3" id="taskList-enProgreso"></div>
                        </div>
                    </div>

                    <!-- Columna Completadas -->
                    <div class="col-md-4">
                        <div class="kanban-column p-3 rounded shadow-sm h-100">
                            <h3 class="h6 fw-bold text-uppercase mb-3 text-secondary border-bottom pb-2">Completadas
                            </h3>
                            <div class="tasks-container d-flex flex-column gap-3" id="taskList-completadas"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer con más presencia -->
    <footer class="footer-enhanced bg-white text-secondary py-4 mt-5 border-top">
        <div class="container text-center">
            <p class="small mb-1 fw-semibold text-dark">Tasks Control Application</p>
            <p class="small mb-0">Desarrollado por <span class="fw-bold text-dark">David Quiroz
                    Gonzalez</span></p>
            <p class="very-small text-muted mt-2 mb-0">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/taskManager.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
